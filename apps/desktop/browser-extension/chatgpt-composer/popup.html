<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LazyPrompting</title><style>
body{font:14px system-ui,sans-serif;width:330px;margin:14px;color:#eaeaea;background:#202126}
label{display:block;font-weight:600;margin-bottom:8px}
textarea{box-sizing:border-box;width:100%;min-height:130px;resize:vertical;background:#303139;color:white;border:1px solid #656674;border-radius:7px;padding:9px}
button{margin-top:10px;padding:9px 12px;width:100%;background:#b5e4d7;color:#17201d;border:0;border-radius:7px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:default}#status{font-size:12px;min-height:22px;margin-top:10px;white-space:pre-wrap}
</style></head><body>
<label for="prompt">Prompt for the current ChatGPT tab</label>
<textarea id="prompt" maxlength="12000" placeholder="Review the prompt before sending"></textarea>
<button id="send" type="button">Send once</button>
<button id="check-status" type="button">Check response status</button>
<div id="status" role="status" aria-live="polite">Nothing sent.</div>
<script src="popup.js"></script>
</body></html>
